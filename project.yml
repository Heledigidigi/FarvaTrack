name: FarvaTrack
options:
  bundleIdPrefix: com.farvatrack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Swift 5 dil modu (Swift 6'nın katı eşzamanlılık denetimleri kapalı)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Varsayılan: imzasız derleme (build.yml ad-hoc imzalar). TestFlight iş akışı
    # (testflight.yml) bu ayarları komut satırından geçersiz kılıp otomatik imzalar.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0

targets:
  FarvaTrack:
    type: application
    platform: iOS
    sources:
      - path: FarvaTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farvatrack.FarvaTrack
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/FarvaTrack.entitlements
        # INFOPLIST_FILE (URL şeması) + aşağıdaki üretilen anahtarlar birleştirilir
        INFOPLIST_FILE: Config/FarvaTrack-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FarvaTrack
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHealthShareUsageDescription: "FarvaTrack, günlük adım, yürüme mesafesi ve aktif enerji verilerini Sağlık uygulamasından okuyarak hedeflerindeki ilerlemeni gösterir. Bu veriler yalnızca cihazında gösterilir ve sunucularımıza gönderilmez."
        INFOPLIST_KEY_NSCameraUsageDescription: "Sohbette fotoğraf çekip video kaydedebilmen için kamera kullanılır."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Sohbette kaydettiğin videolara ses eklenebilmesi için mikrofon kullanılır."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Sohbetteki fotoğraf ve videoları Fotoğraflar'a orijinal kalitesinde kaydedebilmen için."
    dependencies:
      - target: FarvaTrackWidget
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage

  FarvaTrackWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FarvaTrackWidget
      # Uygulamayla paylaşılan App Group deposu
      - path: FarvaTrack/Services/SharedStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farvatrack.FarvaTrack.Widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/FarvaTrackWidget.entitlements
        INFOPLIST_FILE: Config/FarvaTrackWidget-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FarvaTrack
        SKIP_INSTALL: YES

  FarvaTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FarvaTrackTests
    dependencies:
      - target: FarvaTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.farvatrack.FarvaTrackTests

schemes:
  FarvaTrack:
    build:
      targets:
        FarvaTrack: all
        FarvaTrackTests: [test]
    test:
      config: Debug
      targets:
        - FarvaTrackTests
