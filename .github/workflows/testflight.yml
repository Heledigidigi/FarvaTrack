name: TestFlight

# Elle başlatılır: Actions → TestFlight → Run workflow.
# Ücretli Apple Developer Program üyeliği ve aşağıdaki secret'lar gerekir (README → TestFlight).
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Secret'lari kontrol et
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GSI: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          missing=""
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$KEY_P8" ] && missing="$missing ASC_KEY_P8"
          [ -z "$GSI" ] && missing="$missing GOOGLE_SERVICE_INFO_PLIST"
          if [ -n "$missing" ]; then
            echo "::error::Eksik secret'lar:$missing (README → TestFlight bolumune bak)"
            exit 1
          fi

      - name: XcodeGen Kur
        run: brew install xcodegen

      - name: GoogleService-Info.plist ve API anahtari
        env:
          GSI: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p FarvaTrack/Resources "$RUNNER_TEMP/keys"
          python3 - <<'PY'
          import base64, os
          def raw_or_b64(value, marker):
              value = value.strip()
              return value.encode() if marker in value[:200] else base64.b64decode(value)
          open("FarvaTrack/Resources/GoogleService-Info.plist", "wb").write(raw_or_b64(os.environ["GSI"], "<"))
          key_path = os.path.join(os.environ["RUNNER_TEMP"], "keys", f"AuthKey_{os.environ['KEY_ID']}.p8")
          open(key_path, "wb").write(raw_or_b64(os.environ["KEY_P8"], "BEGIN PRIVATE KEY"))
          PY
          plutil -lint FarvaTrack/Resources/GoogleService-Info.plist
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Medya sunucusu adresi (MEDIA_SERVER_URL degiskeni)
        env:
          MEDIA_SERVER_URL: ${{ vars.MEDIA_SERVER_URL }}
        run: |
          mkdir -p FarvaTrack/Resources
          if [ -z "$MEDIA_SERVER_URL" ]; then
            echo "::warning::MEDIA_SERVER_URL degiskeni yok. Fotograf, ses ve sticker gonderimi 'Medya sunucusu ayarlanmamis' hatasi verecek."
            exit 0
          fi
          python3 - <<'PY'
          import os, plistlib
          url = os.environ["MEDIA_SERVER_URL"].strip().rstrip("/")
          with open("FarvaTrack/Resources/MediaServer.plist", "wb") as f:
              plistlib.dump({"URL": url}, f)
          PY

      - name: Projeyi Uret
        run: xcodegen generate

      - name: Arsivle (otomatik imzalama)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project FarvaTrack.xcodeproj \
            -scheme FarvaTrack \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FarvaTrack.xcarchive \
            -clonedSourcePackagesDirPath SourcePackages \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="Apple Development" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee archive.log | grep -E "error:|warning: .*sign|ARCHIVE" || true
          test -d build/FarvaTrack.xcarchive

      - name: TestFlight'a yukle
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/FarvaTrack.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee export.log
          echo "Yukleme tamamlandi. App Store Connect islemeyi bitirince TestFlight'ta gorunur (genelde 5-30 dk)."

      - name: Loglari sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
          retention-days: 7
